<body>

<div id="gameWrapper">

  <div id="topBar">
    <div class="stat title">👾 MONSTER RUSH</div>
    <div class="stat">❤️ <span id="lives">3</span></div>
    <div class="stat">🪙 <span id="coins">0</span></div>
    <div class="stat">🏆 <span id="score">0</span></div>
    <div class="stat">⚡ Lv.<span id="level">1</span></div>
  </div>

  <div id="game">

    <div id="player"></div>

    <div id="message"></div>

    <div id="gameOver">
      <h1>GAME OVER 💀</h1>
      <div id="finalScore">Score: 0</div>
      <div id="finalCoins">Coins: 0</div>
      <button id="restartButton">🔄 PLAY AGAIN</button>
    </div>

    <div id="controls">
      <button class="controlButton" id="leftBtn">⬅️</button>
      <button class="controlButton" id="rightBtn">➡️</button>
      <button class="controlButton" id="upBtn">⬆️</button>
      <button class="controlButton" id="downBtn">⬇️</button>
    </div>

  </div>

  <div id="instructions">
    🎮 WASD / Arrow Keys • 📱 Touch Controls • 🪙 Collect Coins • 👾 Avoid Monsters
  </div>

</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreDisplay = document.getElementById("score");
const coinsDisplay = document.getElementById("coins");
const livesDisplay = document.getElementById("lives");
const levelDisplay = document.getElementById("level");

const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const finalCoins = document.getElementById("finalCoins");
const message = document.getElementById("message");
const restartButton = document.getElementById("restartButton");

let playerX = 0;
let playerY = 0;

let score = 0;
let coins = 0;
let lives = 3;
let level = 1;

let speed = 4;
let gameRunning = true;

let monsters = [];
let coinObjects = [];
let powerObjects = [];

let keys = {};

let lastTime = performance.now();

let monsterTimer = 0;
let coinTimer = 0;
let powerTimer = 0;
let scoreTimer = 0;

let invincibleUntil = 0;
let hitCooldownUntil = 0;

function resetPlayer() {
  playerX = game.clientWidth / 2 - 21;
  playerY = game.clientHeight / 2 - 21;

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";
}

function randomPosition(size) {
  return {
    x: Math.max(5, Math.random() * (game.clientWidth - size - 10)),
    y: Math.max(5, Math.random() * (game.clientHeight - size - 10))
  };
}

function createMonster() {

  const monster = document.createElement("div");
  monster.className = "monster";

  const pos = randomPosition(38);

  monster.style.left = pos.x + "px";
  monster.style.top = pos.y + "px";

  game.appendChild(monster);

  monsters.push({
    el: monster,
    x: pos.x,
    y: pos.y,
    speed: 1.1 + level * 0.12
  });
}

function createCoin() {

  const coin = document.createElement("div");
  coin.className = "coin";

  const pos = randomPosition(26);

  coin.style.left = pos.x + "px";
  coin.style.top = pos.y + "px";

  game.appendChild(coin);

  coinObjects.push({
    el: coin,
    x: pos.x,
    y: pos.y
  });
}

function createPowerUp() {

  const power = document.createElement("div");
  power.className = "power";

  const pos = randomPosition(30);

  power.style.left = pos.x + "px";
  power.style.top = pos.y + "px";

  game.appendChild(power);

  powerObjects.push({
    el: power,
    x: pos.x,
    y: pos.y
  });
}

function distance(x1, y1, x2, y2) {

  const dx = x1 - x2;
  const dy = y1 - y2;

  return Math.sqrt(dx * dx + dy * dy);
}

function showMessage(text) {

  message.textContent = text;
  message.style.opacity = "1";

  clearTimeout(showMessage.timer);

  showMessage.timer = setTimeout(() => {
    message.style.opacity = "0";
  }, 900);
}

function collectCoins() {

  for (let i = coinObjects.length - 1; i >= 0; i--) {

    const c = coinObjects[i];

    if (
      distance(
        playerX + 21,
        playerY + 21,
        c.x + 13,
        c.y + 13
      ) < 36
    ) {

      c.el.remove();
      coinObjects.splice(i, 1);

      coins++;
      score += 10;

      coinsDisplay.textContent = coins;
      scoreDisplay.textContent = score;

      showMessage("+10 🪙");
    }
  }
}

function collectPowerUps() {

  for (let i = powerObjects.length - 1; i >= 0; i--) {

    const p = powerObjects[i];

    if (
      distance(
        playerX + 21,
        playerY + 21,
        p.x + 15,
        p.y + 15
      ) < 39
    ) {

      p.el.remove();
      powerObjects.splice(i, 1);

      invincibleUntil = performance.now() + 5000;

      player.style.background = "#facc15";

      showMessage("⚡ INVINCIBLE!");

      setTimeout(() => {

        if (performance.now() >= invincibleUntil) {
          player.style.background = "#38bdf8";
        }

      }, 5100);
    }
  }
}

function hitMonster() {

  const now = performance.now();

  if (now < invincibleUntil) {
    return;
  }

  if (now < hitCooldownUntil) {
    return;
  }

  hitCooldownUntil = now + 1000;

  lives--;

  livesDisplay.textContent = lives;

  player.style.opacity = "0.3";

  setTimeout(() => {
    player.style.opacity = "1";
  }, 300);

  showMessage("OUCH! 💥");

  if (lives <= 0) {
    endGame();
  }
}

function updateMonsters(delta) {

  for (const m of monsters) {

    const dx = playerX - m.x;
    const dy = playerY - m.y;

    const length = Math.sqrt(dx * dx + dy * dy);

    if (length > 0) {

      m.x += (dx / length) * m.speed * delta / 16;
      m.y += (dy / length) * m.speed * delta / 16;
    }

    m.x = Math.max(0, Math.min(game.clientWidth - 38, m.x));
    m.y = Math.max(0, Math.min(game.clientHeight - 38, m.y));

    m.el.style.left = m.x + "px";
    m.el.style.top = m.y + "px";

    if (
      distance(
        playerX + 21,
        playerY + 21,
        m.x + 19,
        m.y + 19
      ) < 38
    ) {

      hitMonster();

      m.x = Math.random() * Math.max(1, game.clientWidth - 38);
      m.y = Math.random() * Math.max(1, game.clientHeight - 38);
    }
  }
}

function updatePlayer(delta) {

  let dx = 0;
  let dy = 0;

  if (keys["ArrowLeft"] || keys["a"]) dx -= 1;
  if (keys["ArrowRight"] || keys["d"]) dx += 1;
  if (keys["ArrowUp"] || keys["w"]) dy -= 1;
  if (keys["ArrowDown"] || keys["s"]) dy += 1;

  if (dx !== 0 || dy !== 0) {

    const length = Math.sqrt(dx * dx + dy * dy);

    dx /= length;
    dy /= length;

    playerX += dx * speed * delta / 16;
    playerY += dy * speed * delta / 16;
  }

  const maxX = Math.max(0, game.clientWidth - 42);
  const maxY = Math.max(0, game.clientHeight - 42);

  playerX = Math.max(0, Math.min(maxX, playerX));
  playerY = Math.max(0, Math.min(maxY, playerY));

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";
}

function updateGame(time) {

  if (!gameRunning) return;

  const delta = Math.min(time - lastTime, 50);

  lastTime = time;

  updatePlayer(delta);
  updateMonsters(delta);

  collectCoins();
  collectPowerUps();

  monsterTimer += delta;
  coinTimer += delta;
  powerTimer += delta;
  scoreTimer += delta;

  if (
    monsterTimer >
    Math.max(450, 1300 - level * 70)
  ) {

    createMonster();
    monsterTimer = 0;
  }

  if (coinTimer > 1100) {

    createCoin();
    coinTimer = 0;
  }

  if (powerTimer > 9000) {

    createPowerUp();
    powerTimer = 0;
  }

  if (scoreTimer > 1000) {

    score++;
    scoreDisplay.textContent = score;

    scoreTimer = 0;

    const newLevel =
      Math.floor(score / 100) + 1;

    if (newLevel > level) {

      level = newLevel;

      levelDisplay.textContent = level;

      showMessage("LEVEL " + level + "! 🔥");

      speed += 0.25;

      monsters.forEach(m => {
        m.speed += 0.08;
      });
    }
  }

  requestAnimationFrame(updateGame);
}

function endGame() {

  gameRunning = false;

  finalScore.textContent = "Score: " + score;
  finalCoins.textContent = "Coins: " + coins;

  gameOverScreen.style.display = "flex";
}

function restartGame() {

  monsters.forEach(m => m.el.remove());
  coinObjects.forEach(c => c.el.remove());
  powerObjects.forEach(p => p.el.remove());

  monsters = [];
  coinObjects = [];
  powerObjects = [];

  score = 0;
  coins = 0;
  lives = 3;
  level = 1;

  speed = 4;

  invincibleUntil = 0;
  hitCooldownUntil = 0;

  monsterTimer = 0;
  coinTimer = 0;
  powerTimer = 0;
  scoreTimer = 0;

  scoreDisplay.textContent = "0";
  coinsDisplay.textContent = "0";
  livesDisplay.textContent = "3";
  levelDisplay.textContent = "1";

  player.style.background = "#38bdf8";
  player.style.opacity = "1";

  gameOverScreen.style.display = "none";

  resetPlayer();

  gameRunning = true;

  lastTime = performance.now();

  requestAnimationFrame(updateGame);
}

document.addEventListener("keydown", event => {

  keys[event.key] = true;

  if (
    [
      "ArrowUp",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight",
      " "
    ].includes(event.key)
  ) {
    event.preventDefault();
  }
});

document.addEventListener("keyup", event => {
  keys[event.key] = false;
});

function setupTouchButton(id, key) {

  const button = document.getElementById(id);

  const start = event => {
    event.preventDefault();
    keys[key] = true;
  };

  const stop = event => {
    event.preventDefault();
    keys[key] = false;
  };

  button.addEventListener("pointerdown", start);
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("pointerleave", stop);
}

setupTouchButton("leftBtn", "ArrowLeft");
setupTouchButton("rightBtn", "ArrowRight");
setupTouchButton("upBtn", "ArrowUp");
setupTouchButton("downBtn", "ArrowDown");

restartButton.addEventListener("click", restartGame);

window.addEventListener("resize", () => {

  playerX = Math.max(
    0,
    Math.min(playerX, game.clientWidth - 42)
  );

  playerY = Math.max(
    0,
    Math.min(playerY, game.clientHeight - 42)
  );

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";
});

resetPlayer();

createCoin();
createCoin();
createMonster();

requestAnimationFrame(updateGame);
</script>

</body>
</html>
