<style>

#hud{

}

</style>
</head>

<body>

<div id="app">

<div id="hud">

<div class="hudItem title">👾 MONSTER RUSH V2</div>
<div class="hudItem">❤️ <span id="lives">3</span></div>
<div class="hudItem">🪙 <span id="coins">0</span></div>
<div class="hudItem">🏆 <span id="score">0</span></div>
<div class="hudItem">⚡ Lv.<span id="level">1</span></div>
<div class="hudItem">🔥 <span id="combo">0</span></div>

</div>

<div id="game">

<div id="healthBox">
<div id="health"></div>
</div>

<div id="bossBar">
👑 BOSS
<div id="bossHealthOuter">
<div id="bossHealth"></div>
</div>
</div>

<div id="player"></div>

<div id="message"></div>

<button id="pauseButton">Ⅱ</button>

<div id="controls">

<button class="control" id="left">⬅️</button>
<button class="control" id="right">➡️</button>
<button class="control" id="up">⬆️</button>
<button class="control" id="down">⬇️</button>

<button id="attack">⚔️</button>

</div>

<div id="menu">

<h1>MONSTER RUSH</h1>

<div class="subtitle">V2 • SURVIVE THE RUSH 👾</div>

<button class="menuButton" id="playButton">▶ PLAY</button>

<button class="menuButton secondary" id="howButton">❓ HOW TO PLAY</button>

<div id="highScoreText">
🏆 High Score: <span id="highScore">0</span>
</div>

</div>

<div id="pause">

<h1>⏸️ PAUSED</h1>

<button class="menuButton" id="resumeButton">▶ RESUME</button>

</div>

<div id="gameOver">

<h1>GAME OVER 💀</h1>

<div>🏆 Score: <span id="finalScore">0</span></div>
<div>🪙 Coins: <span id="finalCoins">0</span></div>
<div>⭐ Best: <span id="finalBest">0</span></div>

<button class="menuButton" id="againButton">🔄 PLAY AGAIN</button>

<button class="menuButton secondary" id="menuButton">🏠 MENU</button>

</div>

</div>

</div>

<script>

const game=document.getElementById("game");
const player=document.getElementById("player");

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const livesEl=document.getElementById("lives");
const levelEl=document.getElementById("level");
const comboEl=document.getElementById("combo");

const healthEl=document.getElementById("health");
const bossBar=document.getElementById("bossBar");
const bossHealthEl=document.getElementById("bossHealth");

const message=document.getElementById("message");

const menu=document.getElementById("menu");
const pause=document.getElementById("pause");
const gameOver=document.getElementById("gameOver");

const highScoreEl=document.getElementById("highScore");

let playerX=0;
let playerY=0;

let score=0;
let coins=0;
let lives=3;
let level=1;
let combo=0;

let health=100;
let maxHealth=100;

let speed=4;

let running=false;
let paused=false;

let keys={};

let monsters=[];
let coinObjects=[];
let powerObjects=[];
let bullets=[];

let lastTime=performance.now();

let monsterTimer=0;
let coinTimer=0;
let powerTimer=0;
let scoreTimer=0;

let invincibleUntil=0;
let hitCooldownUntil=0;
let attackCooldownUntil=0;

let boss=null;

let highScore=Number(localStorage.getItem("monsterRushHighScore")||0);

highScoreEl.textContent=highScore;

function resetPlayer(){

playerX=game.clientWidth/2-21;
playerY=game.clientHeight/2-21;

player.style.left=playerX+"px";
player.style.top=playerY+"px";
}

function randomPosition(size){

return{
x:Math.max(5,Math.random()*(game.clientWidth-size-10)),
y:Math.max(5,Math.random()*(game.clientHeight-size-10))
};
}

function distance(x1,y1,x2,y2){

let dx=x1-x2;
let dy=y1-y2;

return Math.sqrt(dx*dx+dy*dy);
}

function showMessage(text){

message.textContent=text;
message.style.opacity="1";

clearTimeout(showMessage.timer);

showMessage.timer=setTimeout(()=>{
message.style.opacity="0";
},1000);
}

function createMonster(type="normal"){

const el=document.createElement("div");

el.className="monster "+type;

let size=
type==="boss"?80:
type==="tank"?50:
type==="fast"?32:38;

let pos=randomPosition(size);

el.style.left=pos.x+"px";
el.style.top=pos.y+"px";

game.appendChild(el);

let monster={
el:el,
x:pos.x,
y:pos.y,
type:type,
hp:type==="tank"?3:1,
speed:
type==="fast"?2.4+level*.1:
type==="tank"?.7+level*.05:
1.1+level*.12
};

monsters.push(monster);
}

function createBoss(){

if(boss) return;

const el=document.createElement("div");

el.className="monster boss";

let x=game.clientWidth/2-40;
let y=70;

el.style.left=x+"px";
el.style.top=y+"px";

game.appendChild(el);

boss={
el:el,
x:x,
y:y,
hp:20+level*5,
maxHp:20+level*5,
speed:.7+level*.04
};

bossBar.style.display="block";

updateBossHealth();

showMessage("👑 BOSS INCOMING!");
}

function updateBossHealth(){

if(!boss)return;

let percent=Math.max(0,boss.hp/boss.maxHp*100);

bossHealthEl.style.width=percent+"%";
}

function createCoin(){

const el=document.createElement("div");

el.className="coin";

let pos=randomPosition(26);

el.style.left=pos.x+"px";
el.style.top=pos.y+"px";

game.appendChild(el);

coinObjects.push({
el:el,
x:pos.x,
y:pos.y
});
}

function createPower(){

const el=document.createElement("div");

el.className="power";

let pos=randomPosition(30);

el.style.left=pos.x+"px";
el.style.top=pos.y+"px";

game.appendChild(el);

powerObjects.push({
el:el,
x:pos.x,
y:pos.y
});
}

function shoot(){

let now=performance.now();

if(now<attackCooldownUntil||!running||paused)return;

attackCooldownUntil=now+280;

let target=null;
let best=Infinity;

for(let m of monsters){

let d=distance(
playerX+21,
playerY+21,
m.x+(m.type==="boss"?40:m.type==="tank"?25:19),
m.y+(m.type==="boss"?40:m.type==="tank"?25:19)
);

if(d<best){

best=d;
target=m;
}
}

if(!target&&boss){

let d=distance(
playerX+21,
playerY+21,
boss.x+40,
boss.y+40
);

if(d<best){
target=boss;
}
}

if(!target)return;

let tx=target.x+
(target.type==="boss"?40:
target.type==="tank"?25:19);

let ty=target.y+
(target.type==="boss"?40:
target.type==="tank"?25:19);

let dx=tx-(playerX+21);
let dy=ty-(playerY+21);

let len=Math.sqrt(dx*dx+dy*dy);

if(!len)return;

bullets.push({
x:playerX+16,
y:playerY+16,
vx:dx/len*8,
vy:dy/len*8,
life:1000
});
}

function updateBullets(delta){

for(let i=bullets.length-1;i>=0;i--){

let b=bullets[i];

b.x+=b.vx*delta/16;
b.y+=b.vy*delta/16;
b.life-=delta;

if(!b.el){

b.el=document.createElement("div");
b.el.className="bullet";
game.appendChild(b.el);
}

b.el.style.left=b.x+"px";
b.el.style.top=b.y+"px";

let hit=false;

for(let j=monsters.length-1;j>=0;j--){

let m=monsters[j];

let size=
m.type==="tank"?50:
m.type==="boss"?80:38;

if(distance(
b.x+5,
b.y+5,
m.x+size/2,
m.y+size/2
)<size/2+5){

m.hp--;
hit=true;

if(m.hp<=0){

m.el.remove();
monsters.splice(j,1);

score+=
m.type==="tank"?40:
m.type==="fast"?25:15;

combo++;

scoreEl.textContent=score;
comboEl.textContent=combo;

showMessage("💥 +"+(
m.type==="tank"?40:
m.type==="fast"?25:15
));
}

break;
}
}

if(boss&&!hit){

if(distance(
b.x+5,
b.y+5,
boss.x+40,
boss.y+40
)<48){

boss.hp--;
hit=true;

updateBossHealth();

if(boss.hp<=0){

score+=500;
coins+=10;

scoreEl.textContent=score;
coinsEl.textContent=coins;

boss.el.remove();
boss=null;

bossBar.style.display="none";

showMessage("👑 BOSS DEFEATED! +500");

level++;
levelEl.textContent=level;
}
}
}

if(hit||b.life<=0||
b.x<-20||b.x>game.clientWidth+20||
b.y<-20||b.y>game.clientHeight+20){

if(b.el)b.el.remove();

bullets.splice(i,1);
}
}
}

function updatePlayer(delta){

let dx=0;
let dy=0;

if(keys.ArrowLeft||keys.a)dx--;
if(keys.ArrowRight||keys.d)dx++;
if(keys.ArrowUp||keys.w)dy--;
if(keys.ArrowDown||keys.s)dy++;

if(dx||dy){

let len=Math.sqrt(dx*dx+dy*dy);

dx/=len;
dy/=len;

playerX+=dx*speed*delta/16;
playerY+=dy*speed*delta/16;
}

playerX=Math.max(0,Math.min(game.clientWidth-42,playerX));
playerY=Math.max(0,Math.min(game.clientHeight-42,playerY));

player.style.left=playerX+"px";
player.style.top=playerY+"px";
}

function damagePlayer(){

let now=performance.now();

if(now<invincibleUntil)return;
if(now<hitCooldownUntil)return;

hitCooldownUntil=now+800;

health-=25;
combo=0;

comboEl.textContent=combo;

healthEl.style.width=Math.max(0,health)+"%";

showMessage("💥 HIT!");

if(health<=0){

lives--;

livesEl.textContent=lives;

health=maxHealth;
healthEl.style.width="100%";

if(lives<=0){
endGame();
}
}
}

function updateMonsters(delta){

for(let m of monsters){

let dx=playerX-m.x;
let dy=playerY-m.y;

let len=Math.sqrt(dx*dx+dy*dy);

if(len){

m.x+=dx/len*m.speed*delta/16;
m.y+=dy/len*m.speed*delta/16;
}

let size=
m.type==="tank"?50:38;

m.x=Math.max(0,Math.min(game.clientWidth-size,m.x));
m.y=Math.max(0,Math.min(game.clientHeight-size,m.y));

m.el.style.left=m.x+"px";
m.el.style.top=m.y+"px";

if(distance(
playerX+21,
playerY+21,
m.x+size/2,
m.y+size/2
)<size/2+20){

damagePlayer();

m.x=randomPosition(size).x;
m.y=randomPosition(size).y;
}
}
}

function updateBoss(delta){

if(!boss)return;

let dx=playerX-boss.x;
let dy=playerY-boss.y;

let len=Math.sqrt(dx*dx+dy*dy);

if(len){

boss.x+=dx/len*boss.speed*delta/16;
boss.y+=dy/len*boss.speed*delta/16;
}

boss.x=Math.max(0,Math.min(game.clientWidth-80,boss.x));
boss.y=Math.max(0,Math.min(game.clientHeight-80,boss.y));

boss.el.style.left=boss.x+"px";
boss.el.style.top=boss.y+"px";

if(distance(
playerX+21,
playerY+21,
boss.x+40,
boss.y+40
)<55){

damagePlayer();
}
}

function collectItems(){

for(let i=coinObjects.length-1;i>=0;i--){

let c=coinObjects[i];

if(distance(
playerX+21,
playerY+21,
c.x+13,
c.y+13
)<35){

c.el.remove();
coinObjects.splice(i,1);

coins++;
score+=10;

coinsEl.textContent=coins;
scoreEl.textContent=score;

showMessage("+10 🪙");
}
}

for(let i=powerObjects.length-1;i>=0;i--){

let p=powerObjects[i];

if(distance(
playerX+21,
playerY+21,
p.x+15,
p.y+15
)<40){

p.el.remove();
powerObjects.splice(i,1);

invincibleUntil=performance.now()+5000;

player.style.background="#facc15";

showMessage("⚡ INVINCIBLE!");

setTimeout(()=>{

if(performance.now()>invincibleUntil){
player.style.background="#38bdf8";
}

},5100);
}
}
}

function updateGame(time){

if(!running||paused)return;

let delta=Math.min(time-lastTime,50);

lastTime=time;

updatePlayer(delta);
updateMonsters(delta);
updateBoss(delta);
updateBullets(delta);
collectItems();

monsterTimer+=delta;
coinTimer+=delta;
powerTimer+=delta;
scoreTimer+=delta;

if(monsterTimer>
Math.max(450,1200-level*55)){

let type="normal";

let r=Math.random();

if(level>=3&&r<.15)type="fast";
if(level>=5&&r<.08)type="tank";

createMonster(type);

monsterTimer=0;
}

if(coinTimer>1000){

createCoin();
coinTimer=0;
}

if(powerTimer>8500){

createPower();
powerTimer=0;
}

if(scoreTimer>1000){

score++;
scoreEl.textContent=score;

scoreTimer=0;

let newLevel=Math.floor(score/100)+1;

if(newLevel>level){

level=newLevel;

levelEl.textContent=level;

showMessage("⚡ LEVEL "+level+"!");

if(level%5===0&&!boss){
createBoss();
}
}
}

requestAnimationFrame(updateGame);
}

function startGame(){

monsters.forEach(m=>m.el.remove());
coinObjects.forEach(c=>c.el.remove());
powerObjects.forEach(p=>p.el.remove());
bullets.forEach(b=>{if(b.el)b.el.remove()});

if(boss&&boss.el)boss.el.remove();

monsters=[];
coinObjects=[];
powerObjects=[];
bullets=[];
boss=null;

score=0;
coins=0;
lives=3;
level=1;
combo=0;

health=100;

speed=4;

monsterTimer=0;
coinTimer=0;
powerTimer=0;

);

function togglePause(){

requestAnimationFrame(updateGame);
}
